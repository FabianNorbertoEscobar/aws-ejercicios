AWSTemplateFormatVersion: 2010-09-09
Transform: AWS::Serverless-2016-10-31
Description: Bookmarks - A simple Serverless App using AWS SAM
Resources:
  api:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub
        - Bookmark App
        - ResourceName: /bookmarks
      StageName: !Ref APIGatewayStageName
      Cors:
        AllowMethods: "'POST, GET, DELETE, PUT, PATCH, ANY'"
        AllowHeaders: "'*'"
        AllowOrigin: "'*'"
      DefinitionBody:
        swagger: '2.0'
        info: {}
        paths:
          /bookmarks:
            get:
              x-amazon-apigateway-integration:
                httpMethod: POST
                type: aws_proxy
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${listBookmarks.Arn}/invocations
              responses: {}
            post:
              x-amazon-apigateway-integration:
                httpMethod: POST
                type: aws_proxy
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${createBookmark.Arn}/invocations
              responses: {}
          /bookmarks/{id}:
            get:
              x-amazon-apigateway-integration:
                httpMethod: POST
                type: aws_proxy
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${getBookmark.Arn}/invocations
              responses: {}
            put:
              x-amazon-apigateway-integration:
                httpMethod: POST
                type: aws_proxy
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${updateBookmark.Arn}/invocations
              responses: {}
            delete:
              x-amazon-apigateway-integration:
                httpMethod: POST
                type: aws_proxy
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${deleteBookmark.Arn}/invocations
              responses: {}
          /bookmarks/approval:
            get:
              x-amazon-apigateway-integration:
                httpMethod: POST
                type: aws_proxy
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${userApproval.Arn}/invocations
              responses: {}
            post:
              x-amazon-apigateway-integration:
                httpMethod: POST
                type: aws_proxy
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${userApproval.Arn}/invocations
              responses: {}

      EndpointConfiguration: REGIONAL
    Metadata:
      FinTag: /bookmarks

  getBookmark:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: getBookmark
      Description: !Sub
        - ${ResourceName} Function 
        - ResourceName: getBookmark
      CodeUri: src/getBookmark
      Handler: index.handler
      Runtime: nodejs20.x
      MemorySize: 512
      Timeout: 30
      Tracing: Active
      Role: !Ref LambdaDeploymentRole
      Environment:
        Variables:
          TABLE_NAME: !Ref bookmarksTable
          TABLE_ARN: !GetAtt bookmarksTable.Arn
      Events:
        apiGET:
          Type: Api
          Properties:
            Path: /bookmarks/{id}
            Method: GET
            RestApiId: !Ref api
    Metadata:
      FinTag: getBookmark

  updateBookmark:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: updateBookmark
      Description: !Sub
        - ${ResourceName} Function
        - ResourceName: updateBookmark
      CodeUri: src/updateBookmark
      Handler: index.handler
      Runtime: nodejs20.x
      MemorySize: 512
      Timeout: 30
      Tracing: Active
      Role: !Ref LambdaDeploymentRole
      Environment:
        Variables:
          TABLE_NAME: !Ref bookmarksTable
          TABLE_ARN: !GetAtt bookmarksTable.Arn
      Events:
        apiPUT:
          Type: Api
          Properties:
            Path: /bookmarks/{id}
            Method: PUT
            RestApiId: !Ref api
    Metadata:
      FinTag: updateBookmark

  createBookmark:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: createBookmark
      Description: !Sub
        - ${ResourceName} Function
        - ResourceName: createBookmark
      CodeUri: src/createBookmark
      Handler: index.handler
      Runtime: nodejs20.x
      MemorySize: 512
      Timeout: 30
      Tracing: Active
      Role: !Ref LambdaDeploymentRole
      Environment:
        Variables:
          TABLE_NAME: !Ref bookmarksTable
          TABLE_ARN: !GetAtt bookmarksTable.Arn
      Events:
        apiPOST:
          Type: Api
          Properties:
            Path: /bookmarks
            Method: POST
            RestApiId: !Ref api
    Metadata:
      FinTag: createBookmark

  deleteBookmark:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: deleteBookmark
      Description: !Sub
        - ${ResourceName} Function
        - ResourceName: deleteBookmark
      CodeUri: src/deleteBookmark
      Handler: index.handler
      Runtime: nodejs20.x
      MemorySize: 512
      Timeout: 30
      Tracing: Active
      Role: !Ref LambdaDeploymentRole
      Environment:
        Variables:
          TABLE_NAME: !Ref bookmarksTable
          TABLE_ARN: !GetAtt bookmarksTable.Arn
      Events:
        apiDELETE:
          Type: Api
          Properties:
            Path: /bookmarks/{id}
            Method: DELETE
            RestApiId: !Ref api
    Metadata:
      FinTag: deleteBookmark

  listBookmarks:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: listBookmarks
      Description: !Sub
        - ${ResourceName} Function
        - ResourceName: listBookmarks
      CodeUri: src/listBookmarks
      Handler: index.handler
      Runtime: nodejs20.x
      MemorySize: 512
      Timeout: 30
      Tracing: Active
      Role: !Ref LambdaDeploymentRole
      Environment:
        Variables:
          TABLE_NAME: !Ref bookmarksTable
          TABLE_ARN: !GetAtt bookmarksTable.Arn
          INDEX_NAME: 'user-index'
      Events:
        apiGETAll:
          Type: Api
          Properties:
            Path: /bookmarks
            Method: GET
            RestApiId: !Ref api
    Metadata:
      FinTag: listBookmarks

  contest:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: contest
      Description: !Sub
        - ${ResourceName} Function
        - ResourceName: contest
      CodeUri: src/contest
      Handler: index.handler
      Runtime: nodejs20.x
      MemorySize: 512
      Timeout: 15
      Role: !Ref LambdaDeploymentRole
      Environment:
        Variables:
          TABLE_NAME: 
            Ref: bookmarksTable
    Metadata:
      FinTag: contest
  

  bookmarksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: bookmarkUrl
          AttributeType: S
        - AttributeName: username
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      TableName: bookmarksTable
      GlobalSecondaryIndexes: 
        - 
          IndexName: "bookmarkUrl-index"
          KeySchema: 
            - 
              AttributeName: "bookmarkUrl"
              KeyType: "HASH"
          Projection: 
            ProjectionType: "ALL"
          ProvisionedThroughput: 
            ReadCapacityUnits: "5"
            WriteCapacityUnits: "5"
        -
          IndexName: "user-index"
          KeySchema:
            -
              AttributeName: "username"
              KeyType: "HASH"
          Projection:
            ProjectionType: "ALL"
          ProvisionedThroughput:
            ReadCapacityUnits: "5"
            WriteCapacityUnits: "5"
    Metadata:
      FinTag: Bookmarks


  streamTrigger:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: streamTrigger
      Description: !Sub
        - ${ResourceName} Function
        - ResourceName: streamTrigger
      CodeUri: src/streamTrigger
      Handler: index.handler
      Runtime: nodejs20.x
      MemorySize: 512
      Timeout: 15
      Role: !Ref LambdaDeploymentRole
    Metadata:
      FinTag: streamTrigger
  
  userApproval:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: userApproval
      Description: !Sub
        - ${ResourceName} Function
        - ResourceName: userApproval
      CodeUri: src/userApproval
      Handler: index.handler
      Runtime: nodejs20.x
      MemorySize: 512
      Timeout: 15
      Role: !Ref LambdaDeploymentRole
      Environment:
        Variables:
          TABLE_NAME: !Ref bookmarksTable
          TABLE_ARN: !GetAtt bookmarksTable.Arn
      Events:
        apiUser:
          Type: Api
          Properties:
            Path: /bookmarks/approval
            Method: GET
            RestApiId: !Ref api
    Metadata:
      FinTag: userApproval
  
  userApprovalEmail:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: userApprovalEmail
      Description: !Sub
        - ${ResourceName} Function
        - ResourceName: userApprovalEmail
      CodeUri: src/userApprovalEmail
      Handler: index.handler
      Runtime: nodejs20.x
      MemorySize: 512
      Timeout: 15
      Role: !Ref LambdaDeploymentRole
      Environment:
        Variables:
          contestSnsTopic: !Ref SNSContestTopic
    Metadata:
      FinTag: userApprovalEmail

  validateURL:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: validateURL
      Description: !Sub
        - ${ResourceName} Function
        - ResourceName: validateURL
      CodeUri: src/validateURL
      Handler: index.handler
      Runtime: nodejs20.x
      MemorySize: 512
      Timeout: 15
      Role: !Ref LambdaDeploymentRole
      Environment:
        Variables:
          contestSnsTopic: !Ref SNSContestTopic
    Metadata:
      FinTag: validateURL

  publishApproval:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: publishApproval
      Description: !Sub
        - ${ResourceName} Function
        - ResourceName: publishApproval
      CodeUri: src/publishApproval
      Handler: index.handler
      Runtime: nodejs20.x
      MemorySize: 512
      Timeout: 15
      Role: !Ref LambdaDeploymentRole
      Environment:
        Variables:
          TABLE_NAME: !Ref bookmarksTable
          TABLE_ARN: !GetAtt bookmarksTable.Arn
          contestSnsTopic: !Ref SNSContestTopic
    Metadata:
      FinTag: publishApproval

  EventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    DependsOn:
     - bookmarksTable
     - streamTrigger
    Properties:
      BatchSize: 1
      EventSourceArn: 
        Fn::GetAtt:
          - "bookmarksTable"
          - "StreamArn"
      FunctionName: 
        Fn::GetAtt:
          - "streamTrigger"
          - "Arn"
      Enabled: true
      StartingPosition: TRIM_HORIZON
    
  SNSBookmarkTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: BookmarkTopic

  SNSContestTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: ContestTopic
      
  EventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: bookmarks-bus
  
  EventBridgeCatchAllRule:
    Type: AWS::Events::Rule
    Properties:
      Name: catch-all-rule
      Description: 'catch all rule for cloudwatch logs'
      EventBusName: !Ref EventBus
      EventPattern: 
        source: 
          - "DynamoDB Streams"
        detail-type: 
          - "Shared Bookmarks"
      Targets:
        - Arn: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:${CloudWatchLogGroup}"
          Id: CloudWatchLogGroup

  CloudWatchLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/events/catch-all

  EventBridgeContestRule:
    Type: AWS::Events::Rule
    Properties:
      Name: contest-rule
      Description: 'contest rule'
      EventBusName: !Ref EventBus
      EventPattern: 
        source: 
          - "DynamoDB Streams"
        detail-type: 
          - "Shared Bookmarks"
        detail:
          shared: 
            - true
          contest: 
            - "Entering"
      Targets:
        - Arn: !GetAtt contest.Arn
          Id: contest 
  
  PermissionForEventsToInvokeLambda: 
    Type: AWS::Lambda::Permission
    Properties: 
      FunctionName: 
        Ref: "contest"
      Action: "lambda:InvokeFunction"
      Principal: "events.amazonaws.com"
      SourceArn: 
        Fn::GetAtt: 
          - EventBridgeContestRule
          - Arn

  ApiGatewayInvokeLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties: 
      Action: "lambda:InvokeFunction"
      FunctionName: 
        Ref: "userApproval"
      Principal: "apigateway.amazonaws.com"
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${api}/*/*/*"

  EventBridgeNotifyRule:
    Type: AWS::Events::Rule
    Properties:
      Name: notify-rule
      Description: 'notify rule'
      EventBusName: !Ref EventBus
      EventPattern: 
        source: 
          - "DynamoDB Streams"
        detail-type: 
          - "Shared Bookmarks"
        detail:
          shared: 
            - true
          contest: 
            - anything-but: 
                - "Entering"              
      Targets:
        - Arn: 
            Ref: "SNSBookmarkTopic"
          Id: "SNSBookmarkTopic" 
  
  EventTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties: 
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: 
              Service: events.amazonaws.com
            Action: 'sns:Publish'
            Resource: '*'
      Topics:
        - !Ref SNSBookmarkTopic

Parameters:
  APIGatewayStageName:
    Type: String
    Description: Environment name used for API Gateway Stage names
  LambdaDeploymentRole:
    Type: String
    Description: Role arn used for Lambda functions in this SAM template
  
Outputs:
  ValidateURL:
    Value: !Ref 'validateURL'
    Description: Lambda function to validate the bookmark url
  UserApprovalEmail:
    Value: !Ref 'userApprovalEmail'
    Description: Lambda function to generate the user approval link
  PublishApproval:
    Value: !Ref 'publishApproval'
    Description: Lambda function for approval
