AWSTemplateFormatVersion: 2010-09-09
Description: serverless-api sample application
  
Transform: AWS::Serverless-2016-10-31

Resources:
  getAllItemsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: 'getAllItemsFunction'
      Role: !Sub 'arn:aws:iam::${AWS::AccountId}:role/service-role/serverless-api-role'
      CodeUri: src/getAllItems
      Handler: get-all-items.getAllItemsHandler
      Runtime: nodejs20.x
      MemorySize: 128
      Timeout: 60
      Description: A simple example includes a HTTP get method to get all items from a DynamoDB table.
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SampleTable
      Environment:
        Variables:
          SAMPLE_TABLE: !Ref SampleTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /
            Method: GET
  getByIdFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: 'getByIdFunction'
      Role: !Sub 'arn:aws:iam::${AWS::AccountId}:role/service-role/serverless-api-role'
      CodeUri: src/getById
      Handler: get-by-id.getByIdHandler
      Runtime: nodejs20.x
      MemorySize: 128
      Timeout: 60
      Description: A simple example includes a HTTP get method to get one item by id from a DynamoDB table.
      Policies:
        # Give Create/Read/Update/Delete Permissions to the SampleTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SampleTable
      Environment:
        Variables:
          SAMPLE_TABLE: !Ref SampleTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /{id}
            Method: GET
  putItemFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: 'putItemFunction'
      Role: !Sub 'arn:aws:iam::${AWS::AccountId}:role/service-role/serverless-api-role'
      CodeUri: src/putItem
      Handler: put-item.putItemHandler
      Runtime: nodejs20.x
      MemorySize: 128
      Timeout: 60
      Description: A simple example includes a HTTP post method to add one item to a DynamoDB table.
      Policies:
        # Give Create/Read/Update/Delete Permissions to the SampleTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SampleTable
      Environment:
        Variables:
          SAMPLE_TABLE: !Ref SampleTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /
            Method: POST

  SampleTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      PrimaryKey:
        Name: id
        Type: String
      ProvisionedThroughput:
        ReadCapacityUnits: 2
        WriteCapacityUnits: 2